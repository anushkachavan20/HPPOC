name: API Test Execution and Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------
      # Checkout
      # -----------------------------------
      - name: Checkout repo
        uses: actions/checkout@v6

      # -----------------------------------
      # Python
      # -----------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------
      # k6
      # -----------------------------------
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Check k6 version
        run: k6 version

      # -----------------------------------
      # Run k6 tests
      # -----------------------------------
      - name: Run k6 tests
        run: |
          cd k6

          k6 run tests/customer_service.js \
            --out json=customer_results.json \
            > customer_output.txt 2>&1 || true

          k6 run tests/order_service.js \
            --out json=order_results.json \
            > order_output.txt 2>&1 || true

          k6 run tests/payment_service.js \
            --out json=payment_results.json \
            > payment_output.txt 2>&1 || true

          echo "================================="
          echo "Generated k6 result files:"
          echo "================================="

          ls -lah *.json *.txt || true

      # -----------------------------------
      # Run analysis
      # -----------------------------------
      - name: Run analysis
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          DATADOG_SITE: ${{ secrets.DATADOG_SITE }}
          JIRA_API_URL: ${{ secrets.JIRA_API_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          LOG_LEVEL: INFO

        run: |
          cd python

          if [ -f ../k6/results.json ] && [ -s ../k6/results.json ]; then
            echo "Using k6 results.json"
            python main.py --k6-result ../k6/results.json
          else
            echo "No final results.json found"
            echo "Using sample data for analysis"
            python main.py \
              --k6-result ../k6/sample_results.json \
              --dry-run
          fi

        continue-on-error: true

      # -----------------------------------
      # Upload artifacts
      # -----------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: k6-and-analysis
          path: |
            k6/*.json
            k6/*.txt
            python/logs/
