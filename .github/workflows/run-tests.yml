name: API Test Analysis POC

on:
  workflow_dispatch:
    inputs:
      failure_scenario:
        description: "Select the API failure scenario to test"
        required: true
        default: "500"
        type: choice
        options:
          - none
          - 401
          - 404
          - 500

jobs:
  api-test-analysis:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # ---------------------------------------------------------
      # 3. Setup k6
      # ---------------------------------------------------------
      - name: Setup k6
        uses: grafana/setup-k6-action@v1


      # ---------------------------------------------------------
      # 4. Install Python dependencies
      # ---------------------------------------------------------
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ---------------------------------------------------------
      # 5. Run Customer API tests
      # ---------------------------------------------------------
      - name: Run Customer API tests
        working-directory: k6
        continue-on-error: true
        env:
          FAIL_SCENARIO: ${{ github.event.inputs.failure_scenario }}
        run: |
          echo "Running Customer Service tests..."
          echo "Failure scenario: ${FAIL_SCENARIO}"

          k6 run \
            tests/customer_service.js \
            --out json=customer_results.json


      # ---------------------------------------------------------
      # 6. Run Order API tests
      # ---------------------------------------------------------
      - name: Run Order API tests
        working-directory: k6
        continue-on-error: true
        env:
          FAIL_SCENARIO: ${{ github.event.inputs.failure_scenario }}
        run: |
          echo "Running Order Service tests..."
          echo "Failure scenario: ${FAIL_SCENARIO}"

          k6 run \
            tests/order_service.js \
            --out json=order_results.json


      # ---------------------------------------------------------
      # 7. Run Payment API tests
      # ---------------------------------------------------------
      - name: Run Payment API tests
        working-directory: k6
        continue-on-error: true
        env:
          FAIL_SCENARIO: ${{ github.event.inputs.failure_scenario }}
        run: |
          echo "Running Payment Service tests..."
          echo "Failure scenario: ${FAIL_SCENARIO}"

          k6 run \
            tests/payment_service.js \
            --out json=payment_results.json


      # ---------------------------------------------------------
      # 8. Combine native k6 JSON output
      # ---------------------------------------------------------
      - name: Combine k6 results
        working-directory: k6
        run: |
          echo "Preparing combined k6 result file..."

          rm -f results.json

          for file in \
            customer_results.json \
            order_results.json \
            payment_results.json
          do
            if [ -s "$file" ]; then
              cat "$file" >> results.json
              echo "" >> results.json
            else
              echo "WARNING: $file was not created or is empty"
            fi
          done

          echo ""
          echo "Generated result files:"
          ls -lh *.json || true

          echo ""
          echo "Combined results:"

          if [ -s results.json ]; then
            wc -l results.json
          else
            echo "ERROR: results.json is empty"
            exit 1
          fi


      # ---------------------------------------------------------
      # 9. Run Python analysis
      # ---------------------------------------------------------
      - name: Run API analysis
        working-directory: python
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          DATADOG_SITE: ${{ secrets.DATADOG_SITE }}
          DATADOG_DASHBOARD_ID: ${{ secrets.DATADOG_DASHBOARD_ID }}

          JIRA_API_URL: ${{ secrets.JIRA_API_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

          DRY_RUN: ${{ secrets.DRY_RUN }}

        run: |
          echo "Starting API Test Analysis..."

          if [ ! -s ../k6/results.json ]; then
            echo "ERROR: k6/results.json does not exist or is empty"
            exit 1
          fi

          python main.py \
            --k6-result ../k6/results.json \
            --execution-id "gh_run_${{ github.run_id }}"


      # ---------------------------------------------------------
      # 10. Upload k6 results
      # ---------------------------------------------------------
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            k6/customer_results.json
            k6/order_results.json
            k6/payment_results.json
            k6/results.json
          if-no-files-found: warn


      # ---------------------------------------------------------
      # 11. Upload analysis logs
      # ---------------------------------------------------------
      - name: Upload analysis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-artifacts-${{ github.run_id }}
          path: |
            python/**/*.log
            python/*.log
            python/reports/api_test_analysis.csv
          if-no-files-found: ignore
